# nginx server for the EMF 2026 Schedule site.
#
# Two jobs:
#   1. Serve the three static files (index.html, styles.css, app.js).
#   2. Relay a user's EMF favourites feed from /api/favourites.json.
#
# We need to relay emfcamp.org's favourites feed as it doesn't sent CORS
# headers, and so the browser cannot fetch it cross-origin. This endpoint
# forwards the request to emfcamp.org server-to-server and returns the JSON
# to the app.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static site.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # nginx's bundled mime.types has no .webmanifest entry, so it would be
    # served as octet-stream. Set the correct type for the PWA manifest.
    location = /icons/site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Server-side relay to the user's EMF favourites feed.
    location = /api/favourites.json {
        # No logging
        access_log off;

        # Read-only endpoint: reject anything but GET/HEAD.
        limit_except GET HEAD { deny all; }

        # Resolve emfcamp.org at request time via Docker's embedded DNS
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $emf_host "www.emfcamp.org";

        # Forward the query string unchanged. The host and path are
        # fixed, so this cannot be pointed at any other URL.
        proxy_pass https://$emf_host/favourites.json$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name www.emfcamp.org;
        proxy_set_header Host www.emfcamp.org;
        proxy_set_header Accept application/json;

        # Never forward cookies in either direction
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;

        # The response is personal; keep it out of any cache.
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
